import groovy.json.JsonOutput

plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = "1.1.7"
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'amethyst-legacy-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

def sn3Origin = new URI(providers.gradleProperty('sn3.baseUrl').getOrElse('https://snake-n3st.fr'))
if (sn3Origin.scheme != 'https' || !sn3Origin.host || sn3Origin.rawQuery || sn3Origin.rawFragment || sn3Origin.rawUserInfo || !(sn3Origin.path in ['', '/'])) {
    throw new GradleException('sn3.baseUrl must be an HTTPS origin, without credentials, query or path')
}

// Android uses versionCode, never a version-name comparison, to decide whether an APK is newer.
def sn3VersionCodeText = providers.gradleProperty('sn3.versionCode').getOrElse('10000001')
if (!(sn3VersionCodeText ==~ /[1-9][0-9]{0,9}/) || sn3VersionCodeText.toBigInteger() > 2100000000G) {
    throw new GradleException('sn3.versionCode must be an integer between 1 and 2100000000, without signs or spaces')
}
def sn3VersionCode = sn3VersionCodeText.toInteger()
def sn3VersionName = providers.gradleProperty('sn3.versionName').getOrElse('0.2.0')
if (!(sn3VersionName ==~ /[0-9A-Za-z][0-9A-Za-z.+_-]{0,79}/)) {
    throw new GradleException('sn3.versionName must contain 1 to 80 ASCII letters, digits, dots, plus, underscores or hyphens')
}
def sn3ReleasePath = System.getenv('SN3_RELEASE_KEYSTORE_PATH')
def sn3ReleasePassword = System.getenv('SN3_RELEASE_KEYSTORE_PASSWORD')
def sn3ReleaseAlias = System.getenv('SN3_RELEASE_KEY_ALIAS')
def sn3ReleaseSigningConfigured = [sn3ReleasePath, sn3ReleasePassword, sn3ReleaseAlias].every { it != null && !it.isEmpty() }
def sn3ReleaseRequested = gradle.startParameter.taskNames.any { it.tokenize(':').last().toLowerCase().contains('release') }
if (sn3ReleaseRequested && !sn3ReleaseSigningConfigured) {
    throw new GradleException('Release signing requires SN3_RELEASE_KEYSTORE_PATH, SN3_RELEASE_KEYSTORE_PASSWORD and SN3_RELEASE_KEY_ALIAS; an unsigned production APK will not be built')
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'mc.snakenest.launcher.android'

    compileSdk = 37


    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        customRelease {
            storeFile file("aamc_upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "android_github_release"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
        if (sn3ReleaseSigningConfigured) {
            sn3Release {
                storeFile file(sn3ReleasePath)
                storePassword sn3ReleasePassword
                keyAlias sn3ReleaseAlias
                keyPassword sn3ReleasePassword
            }
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "mc.snakenest.launcher.android"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode sn3VersionCode
        versionName sn3VersionName
        buildConfigField 'String', 'SN3_BASE_URL', JsonOutput.toJson(providers.gradleProperty('sn3.baseUrl').getOrElse('https://snake-n3st.fr'))
        buildConfigField 'String', 'SN3_CLIENT_ID', JsonOutput.toJson(providers.gradleProperty('sn3.clientId').getOrElse(''))
        buildConfigField 'String', 'SN3_ROOT_KEYS', JsonOutput.toJson(providers.gradleProperty('sn3.modpackRootKeys').getOrElse(''))
        testInstrumentationRunner "mc.snakenest.launcher.android.snaken3st.UpdateVerifierInstrumentation"
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "Snake N3st Launcher (Test)"
            resValue "string", "app_short_name", "Snake N3st Launcher (Test)"
            resValue 'string', 'application_package', 'mc.snakenest.launcher.android.debug'
            resValue 'string', 'storageProviderAuthorities', 'mc.snakenest.launcher.android.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'mc.snakenest.launcher.android.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (sn3ReleaseSigningConfigured) signingConfig signingConfigs.sn3Release
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "Snake N3st Launcher"
            resValue "string", "app_short_name", "Snake N3st Launcher"
            resValue 'string', 'storageProviderAuthorities', 'mc.snakenest.launcher.android.scoped.gamefolder'
            resValue 'string', 'application_package', 'mc.snakenest.launcher.android'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    // Never package a Java runtime, even if assets from an older local build remain present.
    // Java is installed on demand by NewJREUtil and reused from the app's runtime directory.
    sourceSets {
        main.assets.setSrcDirs([layout.buildDirectory.dir('generated/sn3-assets')])
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // If you're debugging mesa libs, put them here, android will strip them
            // and not properly link to source files, very smart android studio.
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    // AGP asset merging does not honor AndroidSourceDirectorySet.exclude consistently.
    // Feed it a filtered generated directory, after all native component JARs are ready.
    def sn3Assets = tasks.register("prepareSn3Assets", Sync) {
        dependsOn(componentJars)
        from("src/main/assets") {
            exclude 'components/jre/**', 'components/jre-new/**', 'components/jre-*/**'
        }
        into(layout.buildDirectory.dir('generated/sn3-assets'))
    }
    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(sn3Assets)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

dependencies {
    implementation project(':sn3-core')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    // implementation 'com.wu-man:android-bsf-api:3.1.3'
    implementation 'androidx.preference:preference:1.2.0'
    //implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'

    // implementation 'com.intuit.sdp:sdp-android:1.0.5'
    // implementation 'com.intuit.ssp:ssp-android:1.0.5'

    implementation 'org.tukaani:xz:1.8'
    // Our version of exp4j can be built from source at
    // https://github.com/PojavLauncherTeam/exp4j
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.10'

    // implementation 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.0'

    implementation 'top.fifthlight.touchcontroller:proxy-client-android:0.0.4'

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'], exclude: ['gson-*.jar'])

    implementation "net.java.dev.jna:jna:5.14.0@aar"

    implementation project(":androidnsbypass")

}
apply from: rootProject.file('gradle/prefab_bypass.gradle')

// Aggregate tasks can select release without mentioning it on the command line.
tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'validateSigningRelease']) {
        task.doFirst {
            if (!sn3ReleaseSigningConfigured) throw new GradleException('Production APK signing is not configured; refusing unsigned release packaging')
        }
    }
}
