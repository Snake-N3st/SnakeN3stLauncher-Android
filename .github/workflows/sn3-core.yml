name: Snake N3st core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core at lowest priority
        run: ./scripts/build-sn3.sh -p sn3-core test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn3-core-test-results
          path: sn3-core/build/reports/tests/test
