name: Snake N3st Android APK
on:
  workflow_dispatch:
    inputs:
      client_id:
        description: Client Azuriom Android (sinon variable SN3_CLIENT_ID du dépôt)
        required: false
        type: string
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SN3_CLIENT_ID: ${{ inputs.client_id || vars.SN3_CLIENT_ID }}
      SN3_BASE_URL: ${{ vars.SN3_BASE_URL || 'https://snake-n3st.fr' }}
      SN3_ROOT_KEYS: ${{ vars.SN3_MODPACK_ROOT_KEYS }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate language list
        run: bash scripts/languagelist_updater.sh
      - name: Build debug APK at lowest priority
        run: >-
          ./scripts/build-sn3.sh :app_pojavlauncher:assembleDebug
          "-Psn3.clientId=$SN3_CLIENT_ID"
          "-Psn3.baseUrl=$SN3_BASE_URL"
          "-Psn3.modpackRootKeys=$SN3_ROOT_KEYS"
      - uses: actions/upload-artifact@v4
        with:
          name: SnakeN3stLauncher-Android-debug
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
